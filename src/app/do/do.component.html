<section
  id="services"
  class="relative overflow-hidden px-5 py-20 pt-0 sm:px-8 lg:px-12"
>
  <!-- Background decorations -->
  <div
    class="absolute -left-28 top-20 h-72 w-72 rounded-full bg-blue-300/20 blur-3xl"
  ></div>

  <div
    class="absolute -right-28 bottom-10 h-72 w-72 rounded-full bg-purple-300/20 blur-3xl"
  ></div>

<div class="relative mx-auto max-w-7xl">
  <!-- Heading -->
  <div class="mb-14 text-center">
    <span
      class="inline-block rounded-full bg-blue-50 px-4 py-2 text-xs font-bold uppercase tracking-[0.25em] text-slate-600"
    >
      My Expertise
    </span>

    <h2 class="mt-4 text-3xl font-extrabold text-slate-900 sm:text-4xl">
      What I Do
    </h2>

    <p
      class="mx-auto mt-4 max-w-2xl text-sm leading-7 text-slate-600 sm:text-base"
    >
      I design and develop reliable software solutions by combining modern
      user interfaces, efficient business logic, and scalable integrations.
    </p>

    <div
      class="mx-auto mt-5 h-1 w-20 rounded-full bg-gradient-to-r from-slate-500 to-cyan-500"
    ></div>
  </div>

  <!-- Expertise cards -->
  <div class="grid grid-cols-1 gap-7 md:grid-cols-2 lg:grid-cols-3">
    <article
      *ngFor="let item of expertiseCards; let i = index"
      class="group relative flex h-full flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white p-7 text-left shadow-lg transition-all duration-500 hover:-translate-y-2 hover:border-cyan-300 hover:shadow-2xl"
      [ngClass]="{
        'md:col-span-2 lg:col-span-1':
          i === expertiseCards.length - 1 &&
          expertiseCards.length % 2 !== 0
      }"
      data-aos="fade-up"
      [attr.data-aos-delay]="item.animationDelay"
    >
      <!-- Card number -->
      <span
        class="absolute right-5 top-3 text-6xl font-black text-slate-100 transition-colors group-hover:text-cyan-50"
      >
        0{{ i + 1 }}
      </span>

      <!-- Icon -->
      <div
        class="relative flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-br from-slate-500 to-cyan-700 text-white shadow-lg shadow-cyan-500/25 transition-transform duration-500 group-hover:rotate-6 group-hover:scale-110"
      >
        <svg
          class="h-7 w-7"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.8"
            [attr.d]="item.iconPath"
          />
        </svg>
      </div>

      <!-- Content -->
      <h3 class="mt-6 text-xl font-bold text-slate-900">
        {{ item.title }}
      </h3>

      <p class="mt-3 flex-1 text-sm leading-7 text-slate-600">
        {{ item.description }}
      </p>

      <!-- Technology tags -->
      <div class="mt-6 flex flex-wrap gap-2">
        <span
          *ngFor="let tag of item.tags"
          class="rounded-lg border border-cyan-100 bg-cyan-50 px-3 py-1.5 text-xs font-semibold text-cyan-700 transition-colors duration-300 hover:border-cyan-300 hover:bg-cyan-100"
        >
          {{ tag }}
        </span>
      </div>
    </article>
  </div>
</div>
</section>
