<header
  class="mobile-safe-header sticky top-0 z-50 w-full bg-slate-950 transition-all duration-300 md:bg-transparent md:px-5"
  [ngClass]="isScrolled ? 'md:top-3' : 'md:top-5'"
>
  <nav
    class="relative mx-auto w-full max-w-6xl border-b border-white/10 bg-slate-950/90 shadow-xl shadow-slate-950/20 backdrop-blur-xl transition-all duration-300 md:rounded-2xl md:border"
    [ngClass]="isScrolled ? 'md:bg-slate-950/95 md:shadow-2xl' : ''"
    aria-label="Main navigation"
  >
    <div
      class="mx-auto flex items-center justify-between gap-3 px-4 transition-all duration-300 sm:px-5 md:px-4"
      [ngClass]="isScrolled ? 'py-2.5' : 'py-3 md:py-3.5'"
    >
      <!-- Logo -->
      <button
        type="button"
        (click)="navigateToSection('home')"
        class="group flex min-w-0 items-center gap-3 rounded-xl focus:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400"
        aria-label="Go to home section"
      >
        <span
          class="relative flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-gradient-to-br from-cyan-400 to-blue-700 text-sm font-extrabold text-white shadow-lg shadow-cyan-500/20 transition-transform duration-300 group-hover:rotate-6 group-hover:scale-105"
        >
          MA
          <span
            class="absolute -right-0.5 -top-0.5 h-3 w-3 rounded-full border-2 border-slate-950 bg-emerald-400"
            title="Available for work"
          ></span>
        </span>

        <span class="min-w-0 text-left">
          <span
            class="block truncate text-sm font-bold tracking-wide text-white sm:text-[15px]"
          >
            Muhajir Ahmad
          </span>
          <span
            class="block truncate text-[10px] font-medium uppercase tracking-[0.18em] text-slate-400"
          >
            Software Engineer
          </span>
        </span>
      </button>

      <!-- Desktop navigation -->
      <ul
        class="hidden items-center gap-0.5 rounded-xl border border-white/10 bg-white/[0.04] p-1 lg:flex"
      >
        <li *ngFor="let item of navItems">
          <button
            type="button"
            (click)="navigateToSection(item.id)"
            class="relative rounded-lg px-3.5 py-2 text-sm font-medium transition-all duration-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400"
            [ngClass]="
              activeSection === item.id
                ? 'bg-white/10 text-white shadow-inner'
                : 'text-slate-400 hover:bg-white/5 hover:text-white'
            "
            [attr.aria-current]="activeSection === item.id ? 'true' : null"
          >
            {{ item.label }}
            <span
              class="absolute inset-x-3 -bottom-px h-0.5 rounded-full bg-gradient-to-r from-cyan-400 to-blue-500 transition-all duration-300"
              [ngClass]="
                activeSection === item.id ? 'opacity-100' : 'scale-x-0 opacity-0'
              "
            ></span>
          </button>
        </li>
      </ul>

      <!-- Right actions -->
      <div class="flex shrink-0 items-center gap-2">
        <!-- Dark mode -->
        <!-- <button
          type="button"
          (click)="toggleDarkMode()"
          title="Change theme"
          aria-label="Toggle dark mode"
          class="flex h-10 w-10 items-center justify-center rounded-xl border border-white/10 bg-white/5 text-slate-300 transition-all duration-300 hover:border-blue-400/50 hover:bg-blue-500/10 hover:text-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-400"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.8"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"
            />
          </svg>
        </button> -->

        <!-- GitHub -->
        <a
          href="https://github.com/muhajirahmadh99"
          target="_blank"
          rel="noopener noreferrer"
          title="GitHub"
          aria-label="View my GitHub profile"
          class="hidden h-10 w-10 items-center justify-center rounded-xl border border-white/10 bg-white/5 text-slate-300 transition-all duration-300 hover:border-white/30 hover:bg-white/10 hover:text-white sm:flex"
        >
          <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 .7a11.5 11.5 0 0 0-3.64 22.4c.58.1.79-.25.79-.56v-2.02c-3.22.7-3.9-1.37-3.9-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.78 1.2 1.78 1.2 1.04 1.77 2.72 1.26 3.38.96.1-.75.4-1.26.74-1.55-2.57-.29-5.27-1.28-5.27-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.16 1.18A10.9 10.9 0 0 1 12 6.3c.98 0 1.95.13 2.86.38 2.2-1.49 3.16-1.18 3.16-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.71 5.38-5.29 5.67.42.36.79 1.07.79 2.16v3.08c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"
            />
          </svg>
        </a>

        <!-- Desktop contact button -->
        <button
          type="button"
          (click)="navigateToSection('contact')"
          class="group relative hidden items-center gap-2 overflow-hidden rounded-xl bg-white px-4 py-2.5 text-sm font-semibold text-slate-900 shadow-lg transition-all duration-300 hover:-translate-y-0.5 hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400 md:inline-flex"
        >
          <span
            class="absolute inset-0 bg-gradient-to-r from-cyan-500 to-blue-700 opacity-0 transition-opacity duration-300 group-hover:opacity-100"
          ></span>
          <span class="relative">Let’s talk</span>
          <svg
            class="relative h-4 w-4 transition-transform duration-300 group-hover:translate-x-0.5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0-4 4m4-4H3" />
          </svg>
        </button>

        <!-- Mobile / tablet menu button -->
        <button
          type="button"
          (click)="toggleNavbar()"
          class="relative flex h-10 w-10 items-center justify-center rounded-xl border border-white/10 bg-white/5 text-white transition-colors hover:bg-white/10 focus:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400 lg:hidden"
          aria-controls="mobile-navbar"
          [attr.aria-expanded]="isNavbarOpen"
          [attr.aria-label]="isNavbarOpen ? 'Close menu' : 'Open menu'"
        >
          <!-- Animated hamburger -->
          <span class="relative block h-3.5 w-5" aria-hidden="true">
            <span
              class="absolute left-0 h-0.5 w-5 rounded-full bg-current transition-all duration-300"
              [ngClass]="isNavbarOpen ? 'top-1.5 rotate-45' : 'top-0'"
            ></span>
            <span
              class="absolute left-0 top-1.5 h-0.5 rounded-full bg-current transition-all duration-300"
              [ngClass]="isNavbarOpen ? 'w-0 opacity-0' : 'w-3.5'"
            ></span>
            <span
              class="absolute left-0 h-0.5 w-5 rounded-full bg-current transition-all duration-300"
              [ngClass]="isNavbarOpen ? 'top-1.5 -rotate-45' : 'top-3'"
            ></span>
          </span>
        </button>
      </div>
    </div>

    <!-- Mobile / tablet navigation -->
    <div
      id="mobile-navbar"
      class="grid transition-all duration-300 ease-out lg:hidden"
      [ngClass]="
        isNavbarOpen
          ? 'grid-rows-[1fr] opacity-100'
          : 'pointer-events-none grid-rows-[0fr] opacity-0'
      "
    >
      <div class="overflow-hidden">
        <div class="border-t border-white/10 px-4 pb-5 pt-3 sm:px-5">
          <ul class="grid grid-cols-1 gap-1 sm:grid-cols-2">
            <li *ngFor="let item of navItems; let i = index">
              <button
                type="button"
                (click)="navigateToSection(item.id)"
                [tabindex]="isNavbarOpen ? 0 : -1"
                class="group flex w-full items-center gap-3 rounded-xl px-3 py-3 text-left text-sm font-medium transition-colors"
                [ngClass]="
                  activeSection === item.id
                    ? 'bg-white/10 text-white'
                    : 'text-slate-300 hover:bg-white/5 hover:text-white'
                "
              >
                <span
                  class="font-mono text-[11px]"
                  [ngClass]="
                    activeSection === item.id ? 'text-cyan-400' : 'text-slate-500'
                  "
                >
                  0{{ i + 1 }}
                </span>
                {{ item.label }}
                <span
                  *ngIf="activeSection === item.id"
                  class="ml-auto h-1.5 w-1.5 rounded-full bg-cyan-400"
                ></span>
              </button>
            </li>
          </ul>

          <button
            type="button"
            (click)="navigateToSection('contact')"
            [tabindex]="isNavbarOpen ? 0 : -1"
            class="mt-4 flex w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-700 px-5 py-3 text-sm font-semibold text-white shadow-lg shadow-cyan-900/30 md:hidden"
          >
            Let’s talk
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0-4 4m4-4H3" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Scroll progress -->
    <div
      class="pointer-events-none absolute inset-x-0 bottom-0 h-0.5 overflow-hidden md:inset-x-4"
      aria-hidden="true"
    >
      <div
        class="h-full origin-left rounded-full bg-gradient-to-r from-cyan-400 to-blue-500 transition-transform duration-150"
        [style.transform]="'scaleX(' + scrollProgress + ')'"
      ></div>
    </div>
  </nav>
</header>
