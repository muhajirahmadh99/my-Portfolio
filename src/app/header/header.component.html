<header
  class="sticky top-0 z-50 px-0 py-0 md:top-4 md:px-5 md:py-2"
>
  <nav
    class="mx-auto max-w-7xl border-b border-white/10 bg-slate-950/95 shadow-xl backdrop-blur-xl md:rounded-2xl md:border"
  >
    <div
      class="mx-auto flex min-h-[72px] flex-wrap items-center justify-between px-5 md:px-7"
    >
      <!-- Logo -->
      <button
        type="button"
        (click)="closeNavbar(); service.gotobottom1()"
        class="group flex items-center gap-3"
        aria-label="Go to home section"
      >
        <span
          class="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-br from-cyan-500 to-cyan-900 text-sm font-extrabold text-white shadow-lg shadow-blue-500/20 transition-transform duration-300 group-hover:rotate-6 group-hover:scale-105"
        >
          MA
        </span>

        <span class="text-left">
          <span
            class="block text-sm font-bold tracking-wide text-white sm:text-base"
          >
            MUHAJIR AHMAD
          </span>

          <span class="block text-[10px] tracking-[0.2em] text-slate-400">
            SOFTWARE ENGINEER
          </span>
        </span>
      </button>

      <!-- Desktop navigation -->
      <div class="hidden items-center md:flex">
        <ul
          class="flex items-center gap-1 rounded-xl border border-white/10 bg-white/5 p-1"
        >
          <li>
            <button
              type="button"
              (click)="service.gotobottom1()"
              class="rounded-lg px-4 py-2 text-sm font-medium text-slate-300 transition-all duration-300 hover:bg-white/10 hover:text-white"
            >
              Home
            </button>
          </li>

          <li>
            <button
              type="button"
              (click)="service.gotobottom2()"
              class="rounded-lg px-4 py-2 text-sm font-medium text-slate-300 transition-all duration-300 hover:bg-white/10 hover:text-white"
            >
              About
            </button>
          </li>

          <li>
            <button
              type="button"
              (click)="service.gotobottom3()"
              class="rounded-lg px-4 py-2 text-sm font-medium text-slate-300 transition-all duration-300 hover:bg-white/10 hover:text-white"
            >
              Projects
            </button>
          </li>

          <li>
            <button
              type="button"
              (click)="service.gotobottom4()"
              class="rounded-lg px-4 py-2 text-sm font-medium text-slate-300 transition-all duration-300 hover:bg-white/10 hover:text-white"
            >
              Contact
            </button>
          </li>
        </ul>
      </div>

      <!-- Right actions -->
      <div class="flex items-center gap-2">
        <!-- Dark mode -->
        <!-- <button
          type="button"
          (click)="toggleDarkMode()"
          title="Change theme"
          aria-label="Toggle dark mode"
          class="flex h-10 w-10 items-center justify-center rounded-xl border border-white/10 bg-white/5 text-slate-300 transition-all duration-300 hover:border-blue-400/50 hover:bg-blue-500/10 hover:text-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-400"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.8"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"
            />
          </svg>
        </button> -->

        <!-- Desktop contact button -->
        <button
          type="button"
          (click)="service.gotobottom4()"
          class="hidden items-center gap-2 rounded-xl bg-gradient-to-r from-cyan-500 to-cyan-900 px-5 py-2.5 text-sm font-semibold text-white shadow-lg shadow-blue-500/20 transition-all duration-300 hover:-translate-y-0.5 hover:shadow-xl focus:outline-none focus:ring-2 focus:ring-blue-400 md:inline-flex"
        >
          Contact Me

          <svg
            class="h-4 w-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M17 8l4 4m0 0-4 4m4-4H3"
            />
          </svg>
        </button>

        <!-- Mobile menu button -->
        <button
          type="button"
          (click)="toggleNavbar()"
          class="flex h-10 w-10 items-center justify-center rounded-xl border border-white/10 bg-white/5 text-white transition-colors hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-blue-400 md:hidden"
          aria-controls="mobile-navbar"
          [attr.aria-expanded]="isNavbarOpen"
          [attr.aria-label]="isNavbarOpen ? 'Close menu' : 'Open menu'"
        >
          <!-- Hamburger icon -->
          <svg
            *ngIf="!isNavbarOpen"
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            />
          </svg>

          <!-- Close icon -->
          <svg
            *ngIf="isNavbarOpen"
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18 18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>

      <!-- Mobile navigation -->
      <div
        id="mobile-navbar"
        [ngClass]="{
          'max-h-96 border-t border-white/10 py-4 opacity-100':
            isNavbarOpen,
          'max-h-0 overflow-hidden border-transparent py-0 opacity-0':
            !isNavbarOpen
        }"
        class="w-full transition-all duration-500 ease-in-out md:hidden"
      >
        <ul class="flex flex-col gap-2">
          <li>
            <button
              type="button"
              (click)="closeNavbar(); service.gotobottom1()"
              class="flex w-full items-center rounded-xl px-4 py-3 text-left text-sm font-medium text-slate-300 transition-colors hover:bg-white/10 hover:text-white"
            >
              Home
            </button>
          </li>

          <li>
            <button
              type="button"
              (click)="closeNavbar(); service.gotobottom2()"
              class="flex w-full items-center rounded-xl px-4 py-3 text-left text-sm font-medium text-slate-300 transition-colors hover:bg-white/10 hover:text-white"
            >
              About
            </button>
          </li>

          <li>
            <button
              type="button"
              (click)="closeNavbar(); service.gotobottom3()"
              class="flex w-full items-center rounded-xl px-4 py-3 text-left text-sm font-medium text-slate-300 transition-colors hover:bg-white/10 hover:text-white"
            >
              Projects
            </button>
          </li>

          <li>
            <button
              type="button"
              (click)="closeNavbar(); service.gotobottom4()"
              class="flex w-full items-center justify-between rounded-xl bg-gradient-to-r from-blue-600 to-purple-600 px-4 py-3 text-left text-sm font-semibold text-white"
            >
              Contact Me

              <svg
                class="h-4 w-4"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                aria-hidden="true"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M17 8l4 4m0 0-4 4m4-4H3"
                />
              </svg>
            </button>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>
