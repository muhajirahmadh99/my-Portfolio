<section
  id="projects"
  class="relative overflow-hidden px-5 py-20 pt-0 sm:px-8 lg:px-12"
>
  <!-- Background decoration -->
  <div
    class="absolute -left-24 top-20 h-72 w-72 rounded-full bg-blue-300/20 blur-3xl"
  ></div>

  <div
    class="absolute -right-24 bottom-10 h-72 w-72 rounded-full bg-purple-300/20 blur-3xl"
  ></div>

  <div class="relative mx-auto max-w-7xl">
    <!-- Section heading -->
    <div class="mb-12 text-center">
      <span
        class="mb-3 inline-block rounded-full bg-slate-900 px-4 py-1.5 text-xs font-semibold uppercase tracking-[0.25em] text-white"
      >
        My Work
      </span>

      <h2 class="text-3xl font-bold text-slate-900 sm:text-4xl lg:text-5xl">
        Featured Projects
      </h2>

      <p class="mx-auto mt-4 max-w-2xl text-sm leading-7 text-slate-600 sm:text-base">
        A selection of projects that demonstrate my experience in building
        modern, responsive, and user-friendly applications.
      </p>

      <div
        class="mx-auto mt-5 h-1 w-20 rounded-full bg-gradient-to-r from-slate-500 to-cyan-500"
      ></div>
    </div>

    <!-- Projects grid -->
    <div class="grid grid-cols-1 gap-8 md:grid-cols-2 lg:grid-cols-3">
      <article
        *ngFor="let item of portfolio; let i = index"
        [attr.data-aos]="
          isMobile ? 'fade-up' : i % 2 === 0 ? 'fade-right' : 'fade-left'
        "
        class="group flex h-full flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-lg transition-all duration-500 hover:-translate-y-2 hover:shadow-2xl"
      >
        <!-- Project image -->
        <div class="relative h-56 overflow-hidden bg-slate-200">
          <img
            [src]="item.img"
            [attr.alt]="item.title"
            class="h-full w-full object-cover transition-transform duration-700 group-hover:scale-110"
          />

          <div
            class="absolute inset-0 bg-gradient-to-t from-slate-950/70 via-transparent to-transparent opacity-60 transition-opacity duration-300 group-hover:opacity-80"
          ></div>

          <span
            class="absolute left-4 top-4 rounded-full border border-white/30 bg-slate-950/60 px-3 py-1 text-xs font-medium text-white backdrop-blur-md"
          >
            Project {{ i + 1 }}
          </span>
        </div>

        <!-- Project content -->
        <div class="flex flex-1 flex-col p-6 text-left">
          <h3
            class="text-xl font-bold text-slate-600 transition-colors duration-300 group-hover:text-slate-900"
          >
            {{ item.title }}
          </h3>

          <p class="mt-3 flex-1 text-sm leading-6 text-slate-600">
            {{ item.description }}
          </p>

          <a
            [href]="item.url"
            target="_blank"
            rel="noopener noreferrer"
            class="mt-6 inline-flex w-fit items-center gap-2 rounded-lg bg-slate-900 px-5 py-2.5 text-sm font-semibold text-white shadow-md transition-all duration-300 hover:bg-slate-600 hover:shadow-lg focus:outline-none focus:ring-4 focus:ring-blue-200"
          >
            View Project

            <svg
              class="h-4 w-4 transition-transform duration-300 group-hover:translate-x-1"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M13 7h4m0 0v4m0-4L10 14M7 7h3M7 7a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-3"
              />
            </svg>
          </a>
        </div>
      </article>
    </div>

    <!-- Empty state -->
    <div
      *ngIf="!portfolio || portfolio.length === 0"
      class="rounded-2xl border border-dashed border-slate-300 bg-white/60 px-6 py-16 text-center"
    >
      <p class="text-slate-500">No projects are currently available.</p>
    </div>
  </div>
</section>
