<section
  id="skills"
  class="relative overflow-hidden px-5 py-20 pt-0 sm:px-8 lg:px-12"
>
  <!-- Background decorations -->
  <div
    class="pointer-events-none absolute -left-28 top-24 h-80 w-80 rounded-full bg-cyan-300/20 blur-3xl"
  ></div>
  <div
    class="pointer-events-none absolute -right-28 bottom-10 h-96 w-96 rounded-full bg-blue-300/20 blur-3xl"
  ></div>

  <div class="relative mx-auto max-w-7xl">
    <!-- Heading -->
    <div class="mb-12 text-center" data-aos="fade-up">
      <span
        class="inline-flex items-center gap-2 rounded-full border border-cyan-200 bg-cyan-50 px-4 py-1.5 text-xs font-bold uppercase tracking-[0.25em] text-cyan-700"
      >
        <span class="h-1.5 w-1.5 rounded-full bg-cyan-500"></span>
        Technologies
      </span>

      <h2
        class="mt-5 text-3xl font-extrabold tracking-tight text-slate-900 sm:text-4xl lg:text-5xl"
      >
        My technical
        <span
          class="bg-gradient-to-r from-cyan-600 to-blue-700 bg-clip-text text-transparent"
        >
          skills
        </span>
      </h2>

      <p
        class="mx-auto mt-4 max-w-2xl text-sm leading-7 text-slate-600 sm:text-base"
      >
        Technologies and tools I use to build modern, responsive, and scalable
        software applications.
      </p>
    </div>

    <!-- Logo marquee -->
    <div class="marquee relative mb-14 overflow-hidden py-2" aria-hidden="true">
      <div class="marquee-track flex w-max gap-4">
        <ng-container *ngFor="let _ of [0, 1]">
          <div
            *ngFor="let s of allSkills"
            class="flex shrink-0 items-center gap-2.5 rounded-full border border-slate-200 bg-white/80 py-2 pl-2 pr-4 shadow-sm backdrop-blur"
          >
            <span
              class="flex h-8 w-8 items-center justify-center rounded-full bg-slate-50 p-1.5"
            >
              <img [src]="s.img" alt="" class="h-full w-full object-contain" />
            </span>
            <span class="whitespace-nowrap text-sm font-semibold text-slate-700">
              {{ s.course }}
            </span>
          </div>
        </ng-container>
      </div>
    </div>

    <!-- Skill groups -->
    <div class="grid grid-cols-1 gap-6 lg:grid-cols-12">
      <article
        *ngFor="let group of groups; let gi = index"
        data-aos="fade-up"
        [attr.data-aos-delay]="gi * 100"
        class="group relative overflow-hidden rounded-3xl border border-slate-200 bg-white/90 p-6 shadow-sm backdrop-blur transition-all duration-500 hover:border-cyan-200 hover:shadow-xl hover:shadow-cyan-100 sm:p-8"
        [ngClass]="gi === 0 || gi === 2 ? 'lg:col-span-7' : 'lg:col-span-5'"
      >
        <!-- Group header -->
        <div class="flex items-start gap-4">
          <span
            class="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl bg-gradient-to-br from-cyan-500 to-blue-700 text-white shadow-lg shadow-cyan-500/20 transition-transform duration-500 group-hover:-rotate-6"
          >
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.7"
                [attr.d]="group.iconPath"
              />
            </svg>
          </span>

          <div class="min-w-0 flex-1">
            <div class="flex items-center justify-between gap-3">
              <h3 class="text-lg font-bold text-slate-900 sm:text-xl">
                {{ group.title }}
              </h3>
              <span
                class="rounded-full bg-slate-100 px-2.5 py-0.5 text-xs font-semibold text-slate-500"
              >
                {{ group.skills.length }}
                {{ group.skills.length === 1 ? 'skill' : 'skills' }}
              </span>
            </div>
            <p class="mt-1 text-sm text-slate-500">{{ group.description }}</p>
          </div>
        </div>

        <!-- Skills -->
        <ul
          class="mt-6 grid grid-cols-2 gap-3 sm:grid-cols-3"
          [ngClass]="{
            'lg:grid-cols-3': gi === 0 || gi === 2,
            'lg:grid-cols-2': gi !== 0 && gi !== 2
          }"
        >
          <li
            *ngFor="let item of group.skills"
            class="group/skill flex items-center gap-3 rounded-2xl border border-slate-100 bg-slate-50/80 p-3 transition-all duration-300 hover:-translate-y-0.5 hover:border-cyan-200 hover:bg-white hover:shadow-md"
          >
            <span
              class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-white p-2 shadow-sm ring-1 ring-slate-100 transition-transform duration-300 group-hover/skill:scale-110"
            >
              <img
                [src]="item.img"
                [attr.alt]="item.course + ' logo'"
                loading="lazy"
                class="h-full w-full object-contain"
              />
            </span>
            <span
              class="min-w-0 truncate text-sm font-semibold text-slate-700 transition-colors group-hover/skill:text-cyan-700"
            >
              {{ item.course }}
            </span>
          </li>
        </ul>
      </article>
    </div>
  </div>
</section>
